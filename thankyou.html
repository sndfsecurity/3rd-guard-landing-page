<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thank You</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:#f4f7fb;
    }

    .thankyou-box{
      background:#fff;
      padding:50px 40px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
      max-width:500px;
      width:90%;
    }

    .thankyou-box h1{
      color:#0f172a;
      font-size:38px;
      margin-bottom:15px;
    }

    .thankyou-box p{
      color:#555;
      font-size:16px;
      line-height:1.7;
      margin-bottom:30px;
    }

    .home-btn{
      display:inline-block;
      padding:14px 30px;
      background:#0f172a;
      color:#fff;
      text-decoration:none;
      border-radius:10px;
      font-weight:600;
      transition:0.3s;
    }

    .home-btn:hover{
      transform:translateY(-3px);
    }

  </style>

</head>

<body>

  <div class="thankyou-box">

    <h1>Thank You!</h1>

    <p>
      Your enquiry has been submitted successfully.
      Our team will contact you shortly.
    </p>

    <a href="index.html" class="home-btn">
      Back To Home
    </a>

  </div>
</body>
</html>
